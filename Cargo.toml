[workspace]
members = [
    "crates/amilea-bus",
    "crates/amilea-cia",
    "crates/amilea-chipset",
    "crates/amilea-core",
    "crates/amilea-config",
    "crates/amilea-m68k",
    "crates/amilea-machine",
    "crates/amilea-replay",
    "frontends/amilea-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Ploos AS"]
repository = "https://github.com/Ploos-AS/Amilea"

[workspace.dependencies]
amilea-bus = { path = "crates/amilea-bus" }
amilea-cia = { path = "crates/amilea-cia" }
amilea-chipset = { path = "crates/amilea-chipset" }
amilea-core = { path = "crates/amilea-core" }
amilea-config = { path = "crates/amilea-config" }
amilea-m68k = { path = "crates/amilea-m68k" }
amilea-machine = { path = "crates/amilea-machine" }
amilea-replay = { path = "crates/amilea-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
